name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install tested dependency snapshot (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -c constraints/verified-py312.txt -e '.[dev]'
      - name: Install supported ranges (Python 3.11)
        if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Check source and installed versions
        run: python scripts/check_version.py --installed
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run automated tests
        run: python -m pytest -q -p no:cacheprovider
